services:
  web:
    build: .
    # Dockerfile CMD runs the production server for Railway; locally we want hot reload
    command: ["npm", "run", "dev"]
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
