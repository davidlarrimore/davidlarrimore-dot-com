<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Governance by exception in agentic automation</title>
  <desc id="desc">An agentic system plans and validates work, then routes high-confidence work to automatic publication, uncertain work to human review, and failures to escalation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071427"/><stop offset="1" stop-color="#10263D"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7890A7"/></marker>
    <style>.sans{font-family:Inter,Arial,sans-serif}.eyebrow{font-size:23px;font-weight:700;letter-spacing:3px}.h1{font-size:55px;font-weight:780}.h2{font-size:30px;font-weight:750}.body{font-size:22px}.small{font-size:18px}.white{fill:#F7FAFD}.muted{fill:#A9B8C9}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="95" y="82" class="sans eyebrow" fill="#6EE8E1">THE OPERATING MODEL</text>
  <text x="95" y="150" class="sans h1 white">Automation by default. Human review by exception.</text>
  <text x="95" y="196" class="sans body muted">Autonomy is earned through confidence scoring, guardrails, observability, and clear escalation paths.</text>

  <g filter="url(#shadow)" class="sans">
    <rect x="110" y="300" width="370" height="230" rx="28" fill="#153249" stroke="#3C7182" stroke-width="2"/>
    <text x="150" y="360" class="h2 white">Agentic orchestrator</text>
    <text x="150" y="405" class="body muted">Plans • reasons • acts</text>
    <text x="150" y="442" class="body muted">Self-validates the result</text>
    <text x="150" y="479" class="body muted">Records decisions and evidence</text>

    <rect x="615" y="300" width="370" height="230" rx="28" fill="#17394A" stroke="#49BEBF" stroke-width="2"/>
    <text x="655" y="360" class="h2 white">Confidence + guardrails</text>
    <text x="655" y="405" class="body muted">Data quality</text>
    <text x="655" y="442" class="body muted">Validation + business logic</text>
    <text x="655" y="479" class="body muted">Narrative quality + risk</text>
  </g>
  <line x1="480" y1="415" x2="602" y2="415" stroke="#7890A7" stroke-width="5" marker-end="url(#arr)"/>

  <line x1="985" y1="415" x2="1080" y2="415" stroke="#7890A7" stroke-width="5"/>
  <line x1="1080" y1="415" x2="1080" y2="290" stroke="#7890A7" stroke-width="5"/>
  <line x1="1080" y1="415" x2="1080" y2="540" stroke="#7890A7" stroke-width="5"/>
  <line x1="1080" y1="290" x2="1140" y2="290" stroke="#55D69C" stroke-width="5" marker-end="url(#arr)"/>
  <line x1="1080" y1="415" x2="1140" y2="415" stroke="#F7C65D" stroke-width="5" marker-end="url(#arr)"/>
  <line x1="1080" y1="540" x2="1140" y2="540" stroke="#F06C70" stroke-width="5" marker-end="url(#arr)"/>

  <g filter="url(#shadow)" class="sans">
    <rect x="1160" y="225" width="330" height="130" rx="24" fill="#153D38" stroke="#55D69C" stroke-width="3"/>
    <circle cx="1205" cy="270" r="17" fill="#55D69C"/><text x="1240" y="271" class="h2 white">GREEN</text><text x="1200" y="315" class="body" fill="#C6F8DF">Auto-publish</text>
    <rect x="1160" y="365" width="330" height="130" rx="24" fill="#514326" stroke="#F7C65D" stroke-width="3"/>
    <circle cx="1205" cy="410" r="17" fill="#F7C65D"/><text x="1240" y="411" class="h2 white">YELLOW</text><text x="1200" y="455" class="body" fill="#FFF0B9">Human review</text>
    <rect x="1160" y="505" width="330" height="130" rx="24" fill="#4B2930" stroke="#F06C70" stroke-width="3"/>
    <circle cx="1205" cy="550" r="17" fill="#F06C70"/><text x="1240" y="551" class="h2 white">RED</text><text x="1200" y="595" class="body" fill="#FFD0D2">Escalate + recover</text>
  </g>

  <g class="sans">
    <rect x="110" y="685" width="1380" height="105" rx="20" fill="#0E1F32" stroke="#2B4259"/>
    <text x="150" y="732" class="body white">Jordan’s role changes:</text>
    <text x="375" y="732" class="body muted">from running every step</text>
    <text x="690" y="732" class="body" fill="#6EE8E1">→</text>
    <text x="735" y="732" class="body" fill="#FFD085">to governing thresholds, exceptions, and outcomes.</text>
    <text x="150" y="770" class="small muted">Illustrative decision logic grounded in the Lunch &amp; Learn scenario.</text>
  </g>
</svg>
