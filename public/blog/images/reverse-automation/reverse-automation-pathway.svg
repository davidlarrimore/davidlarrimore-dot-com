<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Reverse automation maturity pathway</title>
  <desc id="desc">A five-stage pathway from manual work through assistive generative AI, augmented workflow, guided automation, and agentic automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061325"/><stop offset="1" stop-color="#12314B"/></linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#365069"/><stop offset=".28" stop-color="#2F8CA5"/><stop offset=".68" stop-color="#39CFC8"/><stop offset="1" stop-color="#F7B85B"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".28"/></filter>
    <style>.sans{font-family:Inter,Arial,sans-serif}.eyebrow{font-size:23px;font-weight:700;letter-spacing:3px}.h1{font-size:48px;font-weight:780}.h2{font-size:29px;font-weight:750}.body{font-size:21px}.small{font-size:18px}.white{fill:#F7FAFD}.muted{fill:#A9B8C9}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="86" class="sans eyebrow" fill="#6EE8E1">REVERSE AUTOMATION MATURITY PATHWAY</text>
  <text x="90" y="153" class="sans h1 white">Value appears early. Autonomy grows deliberately.</text>
  <text x="90" y="198" class="sans body muted">Each stage preserves human judgment while moving it toward higher-value decisions and exception handling.</text>
  <path d="M150 650 C360 650 370 530 560 530 S760 410 930 410 S1110 295 1290 295 S1400 225 1490 225" fill="none" stroke="url(#path)" stroke-width="22" stroke-linecap="round" opacity=".95"/>

  <g filter="url(#shadow)" class="sans">
    <g transform="translate(95 570)"><rect width="260" height="190" rx="24" fill="#152A42" stroke="#52667A" stroke-width="2"/><circle cx="42" cy="42" r="24" fill="#365069"/><text x="42" y="50" class="h2 white" text-anchor="middle">0</text><text x="28" y="94" class="h2 white">Manual workflow</text><text x="28" y="130" class="small muted">Flexible, but slow</text><text x="28" y="158" class="small muted">and person-dependent</text></g>
    <g transform="translate(375 455)"><rect width="280" height="190" rx="24" fill="#143248" stroke="#2F8CA5" stroke-width="2"/><circle cx="42" cy="42" r="24" fill="#2F8CA5"/><text x="42" y="50" class="h2 white" text-anchor="middle">1</text><text x="28" y="94" class="h2 white">Assistive GenAI</text><text x="28" y="130" class="small muted">Summaries, questions,</text><text x="28" y="158" class="small muted">early anomaly spotting</text></g>
    <g transform="translate(690 340)"><rect width="280" height="190" rx="24" fill="#123B4D" stroke="#3DB6BF" stroke-width="2"/><circle cx="42" cy="42" r="24" fill="#3DB6BF"/><text x="42" y="50" class="h2 white" text-anchor="middle">2</text><text x="28" y="94" class="h2 white">Augmented flow</text><text x="28" y="130" class="small muted">Extract, normalize,</text><text x="28" y="158" class="small muted">draft consistent outputs</text></g>
    <g transform="translate(1000 225)"><rect width="280" height="190" rx="24" fill="#124A52" stroke="#54DED6" stroke-width="2"/><circle cx="42" cy="42" r="24" fill="#43CFC7"/><text x="42" y="50" class="h2 white" text-anchor="middle">3</text><text x="28" y="94" class="h2 white">Guided automation</text><text x="28" y="130" class="small muted">Orchestrate steps;</text><text x="28" y="158" class="small muted">confirm key decisions</text></g>
    <g transform="translate(1285 110)"><rect width="240" height="210" rx="24" fill="#5A4325" stroke="#FFC66C" stroke-width="3"/><circle cx="42" cy="42" r="24" fill="#F7B85B"/><text x="42" y="50" class="h2" fill="#071427" text-anchor="middle">4</text><text x="26" y="94" class="h2 white">Agentic</text><text x="26" y="128" class="h2 white">automation</text><text x="26" y="166" class="small" fill="#FFE0AC">Outcomes, validation,</text><text x="26" y="194" class="small" fill="#FFE0AC">escalation by exception</text></g>
  </g>

  <g class="sans">
    <rect x="95" y="805" width="1430" height="2" fill="#3A536A"/>
    <text x="95" y="846" class="small muted">Human role</text>
    <text x="260" y="846" class="body white">Operator</text>
    <text x="775" y="846" class="body white" text-anchor="middle">Guide + reviewer</text>
    <text x="1525" y="846" class="body" fill="#FFD085" text-anchor="end">Governor of outcomes</text>
  </g>
</svg>
